[tools]
ruby = "4.0.6"
node = "24"
aws-cli = "latest"
"github:sorah/mairu" = "latest"
terraform = "1.15.9"
tflint = "0.64.0"
xcodegen = "2.46.0"

[tasks.setup]
description = "Install Ruby and Node.js dependencies"
env = { npm_config_cache = "/tmp/weblog-npm-cache" }
run = [
  "bundle install",
  "npm ci",
]

[tasks.dev]
description = "Run the authoring frontend and backend"
run = [{ tasks = ["dev:api", "dev:web", "dev:bluesky-oauth"] }]

[tasks."dev:api"]
description = "Run the authoring backend on http://127.0.0.1:8000"
run = "INBOX_SOURCES_SECRET_ID=weblog-authoring-development/inbox-sources BLUESKY_OAUTH_ORIGIN=http://127.0.0.1:8001 mairu exec --no-login auto -- bin/authoring"

[tasks."dev:bluesky-oauth"]
description = "Run the Bluesky OAuth loopback server on http://127.0.0.1:8001"
run = "npm run dev:bluesky-oauth"

[tasks."dev:web"]
description = "Run the Vite frontend on http://127.0.0.1:5173"
run = "npm run dev"

[tasks.build]
description = "Build the production site artifact"
run = "npm run build"

[tasks."frontend:format"]
description = "Format the authoring frontend with Biome"
run = "npm run format:authoring"

[tasks."frontend:lint"]
description = "Check frontend formatting and lint rules without changes"
run = "npm run lint:authoring"

[tasks."frontend:typecheck"]
description = "Type-check the authoring frontend"
run = "npm run typecheck"

[tasks."frontend:test"]
description = "Run authoring frontend tests"
run = "npm run test:authoring"

[tasks."frontend:coverage"]
description = "Generate text and LCOV coverage for all authoring TypeScript sources"
run = "npm run coverage:authoring"

[tasks."frontend:build"]
description = "Build the authoring site artifact"
run = "npm run build"

[tasks."bluesky-oauth:format"]
description = "Format the Bluesky OAuth TypeScript with Biome"
run = "npm run format:bluesky-oauth"

[tasks."bluesky-oauth:lint"]
description = "Lint the Bluesky OAuth TypeScript without changes"
run = "npm run lint:bluesky-oauth"

[tasks."bluesky-oauth:typecheck"]
description = "Type-check the Bluesky OAuth Lambda"
run = "npm run typecheck:bluesky-oauth"

[tasks."bluesky-oauth:test"]
description = "Run the Bluesky OAuth tests"
run = "npm run test:bluesky-oauth"

[tasks."bluesky-oauth:coverage"]
description = "Generate text and LCOV coverage for all Bluesky OAuth TypeScript sources"
run = "npm run coverage:bluesky-oauth"

[tasks."bluesky-oauth:build"]
description = "Build the Bluesky OAuth Lambda"
run = "npm run build:bluesky-oauth"

[tasks."scrapbox:format"]
description = "Format the Scrapbox converter with Biome"
run = "npm run format:scrapbox"

[tasks."scrapbox:lint"]
description = "Lint the Scrapbox converter without changes"
run = "npm run lint:scrapbox"

[tasks."scrapbox:typecheck"]
description = "Type-check the Scrapbox converter and tests"
run = "npm run typecheck:scrapbox"

[tasks."scrapbox:test"]
description = "Run the Scrapbox converter tests"
run = "npm run test:scrapbox"

[tasks."scrapbox:coverage"]
description = "Generate text and LCOV coverage for the Scrapbox converter"
run = "npm run coverage:scrapbox"

[tasks."terraform:format"]
description = "Check Terraform formatting"
run = "terraform fmt -check -recursive infra/bootstrap infra/production"

[tasks."terraform:validate"]
description = "Initialize without backends and validate both Terraform roots"
run = [
  "TF_DATA_DIR=/tmp/weblog-terraform-bootstrap terraform -chdir=infra/bootstrap init -backend=false -input=false -lockfile=readonly",
  "TF_DATA_DIR=/tmp/weblog-terraform-bootstrap terraform -chdir=infra/bootstrap validate",
  "TF_DATA_DIR=/tmp/weblog-terraform-production terraform -chdir=infra/production init -backend=false -input=false -lockfile=readonly",
  "TF_DATA_DIR=/tmp/weblog-terraform-production terraform -chdir=infra/production validate",
]

[tasks."terraform:lint"]
description = "Lint both Terraform roots with warnings as failures"
run = [
  "tflint --chdir=infra/bootstrap --minimum-failure-severity=warning",
  "tflint --chdir=infra/production --minimum-failure-severity=warning",
]

[tasks."terraform:test"]
description = "Run production Terraform tests with mock providers"
run = [
  "TF_DATA_DIR=/tmp/weblog-terraform-production terraform -chdir=infra/production init -backend=false -input=false -lockfile=readonly",
  "TF_DATA_DIR=/tmp/weblog-terraform-production terraform -chdir=infra/production test",
]

[tasks."terraform:check"]
description = "Run non-destructive Terraform format, validate, lint, and mock tests"
run = [
  "mise run terraform:format",
  "mise run terraform:validate",
  "mise run terraform:lint",
  "mise run terraform:test",
]

[tasks."ios:generate"]
description = "Generate the PhotoInbox Xcode project from project.yml"
run = "xcodegen generate --spec ios/PhotoInbox/project.yml --project ios/PhotoInbox"

[tasks."ios:format"]
description = "Format PhotoInbox Swift sources with the Xcode toolchain"
run = "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer xcrun swift-format format --in-place --recursive ios/PhotoInbox/PhotoInbox ios/PhotoInbox/PhotoInboxTests"

[tasks."ios:lint"]
description = "Check PhotoInbox Swift formatting without modifying files"
run = "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer xcrun swift-format lint --strict --recursive ios/PhotoInbox/PhotoInbox ios/PhotoInbox/PhotoInboxTests"

[tasks."ios:test"]
description = "Run PhotoInbox XCTest without code coverage"
run = [
  "command rm -rf /tmp/weblog-photo-inbox-derived-data",
  "mise run ios:generate",
  "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer xcrun xcodebuild test -project ios/PhotoInbox/PhotoInbox.xcodeproj -scheme PhotoInbox -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -derivedDataPath /tmp/weblog-photo-inbox-derived-data -enableCodeCoverage NO CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES GCC_TREAT_WARNINGS_AS_ERRORS=YES",
]

[tasks."ios:coverage"]
description = "Run PhotoInbox XCTest and report source coverage"
run = [
  "command rm -rf /tmp/weblog-photo-inbox.xcresult /tmp/weblog-photo-inbox-derived-data",
  "mise run ios:generate",
  "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer xcrun xcodebuild test -project ios/PhotoInbox/PhotoInbox.xcodeproj -scheme PhotoInbox -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -derivedDataPath /tmp/weblog-photo-inbox-derived-data -resultBundlePath /tmp/weblog-photo-inbox.xcresult -enableCodeCoverage YES CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES GCC_TREAT_WARNINGS_AS_ERRORS=YES",
  "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer xcrun xccov view --report --files-for-target PhotoInbox.app /tmp/weblog-photo-inbox.xcresult",
]

[tasks."check:portable"]
description = "Run repository checks that work on Linux and macOS"
run = [
  "mise run ruby:lint",
  "mise run ruby:typecheck",
  "mise run ruby:test",
  "mise run frontend:lint",
  "mise run frontend:typecheck",
  "mise run frontend:test",
  "mise run bluesky-oauth:lint",
  "mise run bluesky-oauth:typecheck",
  "mise run bluesky-oauth:test",
  "mise run bluesky-oauth:build",
  "mise run scrapbox:lint",
  "mise run scrapbox:typecheck",
  "mise run scrapbox:test",
  "mise run frontend:build",
]

[tasks."check:ios"]
description = "Run PhotoInbox checks that require macOS and Xcode"
run = [
  "mise run ios:lint",
  "mise run ios:test",
]

[tasks.check]
description = "Run all repository checks on macOS"
run = [
  "mise run check:portable",
  "mise run terraform:check",
  "mise run check:ios",
]

[tasks."check:production"]
description = "Check read-only production state with AWS credentials"
run = "mairu exec --no-login --server asonas-aws 282782318939/AdministratorAccess -- bin/check-production"

[tasks."ruby:format"]
description = "Format Ruby files with RuboCop"
run = "bundle exec rubocop -a"

[tasks."ruby:lint"]
description = "Lint Ruby files without modifying them"
run = "bundle exec rubocop"

[tasks."ruby:test"]
description = "Run the Ruby test suite"
run = "bundle exec ruby -Itest -e 'Dir[\"test/authoring/test_*.rb\", \"test/migration/test_*.rb\", \"test/tooling/test_*.rb\"].sort.each { |file| require_relative file }'"

[tasks."ruby:coverage"]
description = "Generate Ruby coverage in coverage/ruby"
env = { COVERAGE = "1" }
run = "bundle exec ruby -Itest -e 'Dir[\"test/authoring/test_*.rb\", \"test/migration/test_*.rb\", \"test/tooling/test_*.rb\"].sort.each { |file| require_relative file }'"

[tasks."ruby:typecheck"]
description = "Type-check Ruby domain and persistence boundaries with Steep"
run = "bundle exec steep check"

[tasks."ruby:typeprof"]
description = "Inspect inferred Ruby signatures without updating sig"
run = "bundle exec typeprof lib/weblog_authoring/models.rb lib/weblog_authoring/dsql_database.rb"
