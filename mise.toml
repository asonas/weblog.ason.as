[tools]
ruby = "4.0.6"
node = "24"
aws-cli = "latest"
"github:sorah/mairu" = "latest"
terraform = "1.15.9"

[tasks.setup]
description = "Install Ruby and Node.js dependencies"
env = { npm_config_cache = "/tmp/weblog-npm-cache" }
run = [
  "bundle install",
  "npm ci",
]

[tasks.dev]
description = "Run the authoring frontend and backend"
run = [{ tasks = ["dev:api", "dev:web"] }]

[tasks."dev:api"]
description = "Run the authoring backend on http://127.0.0.1:8000"
run = "mairu exec --no-login --server asonas-aws 282782318939/weblog-authoring-development -- bin/authoring"

[tasks."dev:web"]
description = "Run the Vite frontend on http://127.0.0.1:5173"
run = "npm run dev"

[tasks.build]
description = "Build the production site artifact"
run = "npm run build"

[tasks."ruby:format"]
description = "Format Ruby files with RuboCop"
run = "bundle exec rubocop -a"

[tasks."ruby:lint"]
description = "Lint Ruby files without modifying them"
run = "bundle exec rubocop"

[tasks."ruby:test"]
description = "Run the Ruby test suite"
run = "bundle exec ruby -Itest -e 'Dir[\"test/authoring/test_*.rb\", \"test/migration/test_*.rb\", \"test/tooling/test_*.rb\"].sort.each { |file| require_relative file }'"

[tasks."ruby:coverage"]
description = "Generate Ruby coverage in coverage/ruby"
env = { COVERAGE = "1" }
run = "bundle exec ruby -Itest -e 'Dir[\"test/authoring/test_*.rb\", \"test/migration/test_*.rb\", \"test/tooling/test_*.rb\"].sort.each { |file| require_relative file }'"

[tasks."ruby:typecheck"]
description = "Type-check Ruby domain and persistence boundaries with Steep"
run = "bundle exec steep check"

[tasks."ruby:typeprof"]
description = "Inspect inferred Ruby signatures without updating sig"
run = "bundle exec typeprof lib/weblog_authoring/models.rb lib/weblog_authoring/dsql_database.rb"
