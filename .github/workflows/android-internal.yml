name: Android internal testing

'on':
  push:
    branches: [main]
    paths:
      - 'android/PhotoInbox/**'
      - '.github/workflows/android-internal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-internal
  cancel-in-progress: false

jobs:
  distribute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: android/PhotoInbox
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: android/PhotoInbox

      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/photo-inbox-upload.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          printf 'ANDROID_KEYSTORE_PATH=%s\n' "$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Test and build signed bundle
        run: |
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          bash ./gradlew testDebugUnitTest bundleRelease -PciVersionCode="$VERSION_CODE"

      - name: Authenticate to Google Play
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: weblog-ason-as
          workload_identity_provider: projects/1026457034826/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-play-publisher@weblog-ason-as.iam.gserviceaccount.com

      - name: Publish internal test release
        run: bundle exec fastlane android internal

      - name: Remove upload key
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"
