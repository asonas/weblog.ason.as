name: Apply production Terraform

'on':
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-terraform
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: terraform tflint

      - name: Run Terraform quality checks
        run: mise run terraform:check

      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: arn:aws:iam::282782318939:role/WeblogGitHubTerraform
          aws-region: ap-northeast-1

      - name: Initialize production state
        run: terraform -chdir=infra/production init -input=false -lockfile=readonly

      - name: Detect bootstrap images
        id: bootstrap
        run: |
          detect() {
            service="$1"
            repository="$2"
            if error="$(aws ecr describe-images --repository-name "$repository" --image-ids imageTag=bootstrap 2>&1 >/dev/null)"; then
              echo "${service}=false" >> "$GITHUB_OUTPUT"
            elif [[ "$error" == *ImageNotFoundException* || "$error" == *RepositoryNotFoundException* ]]; then
              echo "${service}=true" >> "$GITHUB_OUTPUT"
            else
              echo "$error" >&2
              exit 1
            fi
          }
          detect search weblog-search-indexer-production
          detect inbox weblog-inbox-sync-production
          detect oauth weblog-bluesky-oauth-production

      - name: Plan search indexer bootstrap repository
        if: steps.bootstrap.outputs.search == 'true'
        run: >-
          terraform -chdir=infra/production plan -input=false
          -target=aws_ecr_repository.search_indexer
          -target=aws_ecr_lifecycle_policy.search_indexer
          -out=search-bootstrap.tfplan
      - name: Apply search indexer bootstrap repository plan
        if: steps.bootstrap.outputs.search == 'true'
        run: terraform -chdir=infra/production apply -input=false -auto-approve search-bootstrap.tfplan

      - name: Plan inbox sync bootstrap repository
        if: steps.bootstrap.outputs.inbox == 'true'
        run: >-
          terraform -chdir=infra/production plan -input=false
          -target=aws_ecr_repository.inbox_sync
          -target=aws_ecr_lifecycle_policy.inbox_sync
          -out=inbox-bootstrap.tfplan
      - name: Apply inbox sync bootstrap repository plan
        if: steps.bootstrap.outputs.inbox == 'true'
        run: terraform -chdir=infra/production apply -input=false -auto-approve inbox-bootstrap.tfplan

      - name: Plan Bluesky OAuth bootstrap repository
        if: steps.bootstrap.outputs.oauth == 'true'
        run: >-
          terraform -chdir=infra/production plan -input=false
          -target=aws_ecr_repository.bluesky_oauth
          -target=aws_ecr_lifecycle_policy.bluesky_oauth
          -out=oauth-bootstrap.tfplan
      - name: Apply Bluesky OAuth bootstrap repository plan
        if: steps.bootstrap.outputs.oauth == 'true'
        run: terraform -chdir=infra/production apply -input=false -auto-approve oauth-bootstrap.tfplan

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        if: steps.bootstrap.outputs.search == 'true' || steps.bootstrap.outputs.inbox == 'true' || steps.bootstrap.outputs.oauth == 'true'
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: steps.bootstrap.outputs.search == 'true' || steps.bootstrap.outputs.inbox == 'true' || steps.bootstrap.outputs.oauth == 'true'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.bootstrap.outputs.search == 'true' || steps.bootstrap.outputs.inbox == 'true' || steps.bootstrap.outputs.oauth == 'true'

      - name: Publish search indexer bootstrap image
        if: steps.bootstrap.outputs.search == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.search-indexer
          platforms: linux/arm64
          provenance: false
          push: true
          tags: 282782318939.dkr.ecr.ap-northeast-1.amazonaws.com/weblog-search-indexer-production:bootstrap
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish inbox sync bootstrap image
        if: steps.bootstrap.outputs.inbox == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.inbox-sync
          platforms: linux/arm64
          provenance: false
          push: true
          tags: 282782318939.dkr.ecr.ap-northeast-1.amazonaws.com/weblog-inbox-sync-production:bootstrap
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish Bluesky OAuth bootstrap image
        if: steps.bootstrap.outputs.oauth == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.bluesky-oauth
          platforms: linux/arm64
          provenance: false
          push: true
          tags: 282782318939.dkr.ecr.ap-northeast-1.amazonaws.com/weblog-bluesky-oauth-production:bootstrap
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create production plan
        run: terraform -chdir=infra/production plan -input=false -out=production.tfplan

      - name: Apply saved production plan
        run: terraform -chdir=infra/production apply -input=false -auto-approve production.tfplan
