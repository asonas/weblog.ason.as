name: Apply production Terraform

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-terraform
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: arn:aws:iam::282782318939:role/WeblogGitHubTerraform
          aws-region: ap-northeast-1

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.9

      - name: Initialize Terraform
        run: terraform -chdir=infra/production init -input=false

      - name: Validate Terraform
        run: terraform -chdir=infra/production validate

      - name: Create search indexer repository
        run: terraform -chdir=infra/production apply -input=false -auto-approve -target=aws_ecr_repository.search_indexer -target=aws_ecr_lifecycle_policy.search_indexer

      - name: Create inbox sync repository
        run: terraform -chdir=infra/production apply -input=false -auto-approve -target=aws_ecr_repository.inbox_sync -target=aws_ecr_lifecycle_policy.inbox_sync

      - name: Detect bootstrap image
        id: search-bootstrap
        run: |
          if aws ecr describe-images --repository-name weblog-search-indexer-production --image-ids imageTag=bootstrap >/dev/null 2>&1; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect inbox sync bootstrap image
        id: inbox-sync-bootstrap
        run: |
          if aws ecr describe-images --repository-name weblog-inbox-sync-production --image-ids imageTag=bootstrap >/dev/null 2>&1; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        if: steps.search-bootstrap.outputs.missing == 'true' || steps.inbox-sync-bootstrap.outputs.missing == 'true'

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: steps.search-bootstrap.outputs.missing == 'true' || steps.inbox-sync-bootstrap.outputs.missing == 'true'

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.search-bootstrap.outputs.missing == 'true' || steps.inbox-sync-bootstrap.outputs.missing == 'true'

      - name: Publish search indexer bootstrap image
        if: steps.search-bootstrap.outputs.missing == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.search-indexer
          platforms: linux/arm64
          provenance: false
          push: true
          tags: 282782318939.dkr.ecr.ap-northeast-1.amazonaws.com/weblog-search-indexer-production:bootstrap
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish inbox sync bootstrap image
        if: steps.inbox-sync-bootstrap.outputs.missing == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.inbox-sync
          platforms: linux/arm64
          provenance: false
          push: true
          tags: 282782318939.dkr.ecr.ap-northeast-1.amazonaws.com/weblog-inbox-sync-production:bootstrap
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Plan Terraform
        run: terraform -chdir=infra/production plan -input=false -out=tfplan

      - name: Apply Terraform
        run: terraform -chdir=infra/production apply -input=false -auto-approve tfplan
