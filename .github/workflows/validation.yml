name: Validate

'on':
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: ruby node

      - name: Install locked dependencies
        run: mise run setup

      - name: Install image processing library
        run: sudo apt-get update && sudo apt-get install -y libvips-tools

      - name: Run portable checks and build site
        run: mise run check:portable

      - name: Record artifact commit
        run: |
          jq --null-input --arg commit_sha "$GITHUB_SHA" \
            '{commit_sha: $commit_sha}' > dist/site/artifact-metadata.json
          {
            echo "## site-${GITHUB_SHA}"
            echo "Commit: \`${GITHUB_SHA}\`"
            echo ""
            echo '```text'
            find dist/site -type f -print | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-${{ github.sha }}
          path: dist/site
          if-no-files-found: error
          retention-days: 7
