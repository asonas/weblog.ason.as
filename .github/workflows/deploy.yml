name: Deploy production

'on':
  workflow_run:
    workflows: [Validate]
    types: [completed]

permissions:
  actions: read
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-1
  AWS_ACCOUNT_ID: "282782318939"
  DSQL_HOST: zjuauvwetzvab4i3bdfd47e3yu.dsql.ap-northeast-1.on.aws
  DSQL_RUNTIME_ROLE_ARN: arn:aws:iam::282782318939:role/weblog-authoring-production-runtime
  SEARCH_INDEXER_DSQL_RUNTIME_ROLE_ARN: arn:aws:iam::282782318939:role/weblog-search-indexer-production-runtime
  INBOX_SYNC_DSQL_RUNTIME_ROLE_ARN: arn:aws:iam::282782318939:role/weblog-inbox-sync-production-runtime
  BLUESKY_OAUTH_DSQL_RUNTIME_ROLE_ARN: arn:aws:iam::282782318939:role/weblog-bluesky-oauth-production-runtime
  WEBMENTION_RECEIVER_DSQL_RUNTIME_ROLE_ARN: arn:aws:iam::282782318939:role/weblog-webmention-receiver-production-runtime
  WEBMENTION_WORKER_DSQL_RUNTIME_ROLE_ARN: arn:aws:iam::282782318939:role/weblog-webmention-worker-production-runtime
  WEBMENTION_PUBLISHER_DSQL_RUNTIME_ROLE_ARN: arn:aws:iam::282782318939:role/weblog-webmention-publisher-production-runtime
  WEBMENTION_CLEANUP_DSQL_RUNTIME_ROLE_ARN: arn:aws:iam::282782318939:role/weblog-webmention-cleanup-production-runtime
  ECR_REPOSITORY: weblog-authoring-production
  LAMBDA_FUNCTION: weblog-authoring-production
  SEARCH_INDEXER_ECR_REPOSITORY: weblog-search-indexer-production
  SEARCH_INDEXER_LAMBDA_FUNCTION: weblog-search-indexer-production
  INBOX_SYNC_ECR_REPOSITORY: weblog-inbox-sync-production
  INBOX_SYNC_LAMBDA_FUNCTION: weblog-inbox-sync-production
  MATRIX_NOTIFIER_LAMBDA_FUNCTION: weblog-matrix-notifier-production
  BLUESKY_OAUTH_ECR_REPOSITORY: weblog-bluesky-oauth-production
  BLUESKY_OAUTH_LAMBDA_FUNCTION: weblog-bluesky-oauth-production
  WEBMENTION_RECEIVER_LAMBDA_FUNCTION: weblog-webmention-receiver-production
  WEBMENTION_WORKER_LAMBDA_FUNCTION: weblog-webmention-worker-production
  WEBMENTION_PUBLISHER_LAMBDA_FUNCTION: weblog-webmention-publisher-production
  WEBMENTION_CLEANUP_LAMBDA_FUNCTION: weblog-webmention-cleanup-production
  SITE_BUCKET: weblog-asonas-site-production-282782318939
  CLOUDFRONT_DISTRIBUTION_ID: E3BCWEKGAG5LSG
  SITE_URL: https://weblog.ason.as

jobs:
  gate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.current.outputs.current }}
    steps:
      - name: Skip superseded validation
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha="$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq .object.sha)"
          if [[ "$TARGET_SHA" == "$current_sha" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping superseded validation for ${TARGET_SHA}; main is ${current_sha}."
          fi

  build-authoring:
    needs: gate
    if: needs.gate.outputs.current == 'true'
    uses: ./.github/workflows/build-lambda-image.yml
    with:
      service: authoring
      target_sha: ${{ github.event.workflow_run.head_sha }}
      repository: weblog-authoring-production
      function_name: weblog-authoring-production
      dockerfile: Dockerfile.lambda
      build_inputs: '[".dockerignore","Dockerfile.lambda","Gemfile","Gemfile.lock","lib","lambda"]'

  build-search:
    needs: gate
    if: needs.gate.outputs.current == 'true'
    uses: ./.github/workflows/build-lambda-image.yml
    with:
      service: search-indexer
      target_sha: ${{ github.event.workflow_run.head_sha }}
      repository: weblog-search-indexer-production
      function_name: weblog-search-indexer-production
      dockerfile: Dockerfile.search-indexer
      build_inputs: '[".dockerignore","Dockerfile.search-indexer","Gemfile","Gemfile.lock","lib","lambda/search_indexer.rb"]'

  build-inbox:
    needs: gate
    if: needs.gate.outputs.current == 'true'
    uses: ./.github/workflows/build-lambda-image.yml
    with:
      service: inbox-sync
      target_sha: ${{ github.event.workflow_run.head_sha }}
      repository: weblog-inbox-sync-production
      function_name: weblog-inbox-sync-production
      dockerfile: Dockerfile.inbox-sync
      build_inputs: '[".dockerignore","Dockerfile.inbox-sync","Gemfile","Gemfile.lock","lib","lambda/inbox_sync.rb","lambda/matrix_notifier.rb"]'

  build-oauth:
    needs: gate
    if: needs.gate.outputs.current == 'true'
    uses: ./.github/workflows/build-lambda-image.yml
    with:
      service: bluesky-oauth
      target_sha: ${{ github.event.workflow_run.head_sha }}
      repository: weblog-bluesky-oauth-production
      function_name: weblog-bluesky-oauth-production
      dockerfile: Dockerfile.bluesky-oauth
      build_inputs: '[".dockerignore","Dockerfile.bluesky-oauth","package.json","package-lock.json","tsconfig.bluesky-oauth.json","lambda/bluesky_oauth"]'

  deploy:
    needs: [gate, build-authoring, build-search, build-inbox, build-oauth]
    if: >-
      always() &&
      needs.gate.outputs.current == 'true' &&
      needs.build-authoring.result == 'success' &&
      needs.build-search.result == 'success' &&
      needs.build-inbox.result == 'success' &&
      needs.build-oauth.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      AUTHORING_DIGEST: ${{ needs.build-authoring.outputs.digest }}
      SEARCH_DIGEST: ${{ needs.build-search.outputs.digest }}
      INBOX_DIGEST: ${{ needs.build-inbox.outputs.digest }}
      OAUTH_DIGEST: ${{ needs.build-oauth.outputs.digest }}
    steps:
      - name: Record production deploy start
        id: timing
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download validated site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site-${{ github.event.workflow_run.head_sha }}
          path: dist/site
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify deployment inputs
        run: |
          checkout_sha="$(git rev-parse HEAD)"
          artifact_sha="$(jq --raw-output .commit_sha dist/site/artifact-metadata.json)"
          [[ "$checkout_sha" == "$TARGET_SHA" ]]
          [[ "$artifact_sha" == "$TARGET_SHA" ]]
          [[ "$AUTHORING_DIGEST" == sha256:* ]]
          [[ -f dist/site/index.html ]]
          find dist/site/static/authoring/assets -type f -print -quit | grep -q .

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # master
        with:
          ruby-version: 4.0.6
          bundler-cache: true

      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: arn:aws:iam::282782318939:role/WeblogGitHubDeploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Detect optional Lambda infrastructure
        id: infra
        run: |
          for service in search inbox notifier oauth receiver worker publisher cleanup; do
            case "$service" in
              search) repository="$SEARCH_INDEXER_ECR_REPOSITORY"; function="$SEARCH_INDEXER_LAMBDA_FUNCTION" ;;
              inbox) repository="$INBOX_SYNC_ECR_REPOSITORY"; function="$INBOX_SYNC_LAMBDA_FUNCTION" ;;
              notifier) repository="$INBOX_SYNC_ECR_REPOSITORY"; function="$MATRIX_NOTIFIER_LAMBDA_FUNCTION" ;;
              oauth) repository="$BLUESKY_OAUTH_ECR_REPOSITORY"; function="$BLUESKY_OAUTH_LAMBDA_FUNCTION" ;;
              receiver) repository="$ECR_REPOSITORY"; function="$WEBMENTION_RECEIVER_LAMBDA_FUNCTION" ;;
              worker) repository="$ECR_REPOSITORY"; function="$WEBMENTION_WORKER_LAMBDA_FUNCTION" ;;
              publisher) repository="$ECR_REPOSITORY"; function="$WEBMENTION_PUBLISHER_LAMBDA_FUNCTION" ;;
              cleanup) repository="$ECR_REPOSITORY"; function="$WEBMENTION_CLEANUP_LAMBDA_FUNCTION" ;;
            esac
            if ! repository_error="$(aws ecr describe-repositories --repository-names "$repository" 2>&1 >/dev/null)"; then
              if [[ "$repository_error" != *RepositoryNotFoundException* ]]; then
                echo "$repository_error" >&2
                exit 1
              fi
              echo "${service}=false" >> "$GITHUB_OUTPUT"
              continue
            fi
            if ! function_error="$(aws lambda get-function --function-name "$function" 2>&1 >/dev/null)"; then
              if [[ "$service" =~ ^(notifier|receiver|worker|publisher|cleanup)$ && "$function_error" == *AccessDeniedException* ]]; then
                echo "Deploy permission is not provisioned yet; skipping ${service}." >&2
                echo "${service}=false" >> "$GITHUB_OUTPUT"
                continue
              fi
              if [[ "$function_error" != *ResourceNotFoundException* ]]; then
                echo "$function_error" >&2
                exit 1
              fi
              echo "${service}=false" >> "$GITHUB_OUTPUT"
              continue
            fi
            echo "${service}=true" >> "$GITHUB_OUTPUT"
          done

      - name: Recheck current main before deployment
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq .object.sha)"
          if [[ "$TARGET_SHA" == "$current_sha" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping superseded validation for ${TARGET_SHA}; main is ${current_sha}."
          fi

      - name: Apply database schema
        if: steps.current.outputs.current == 'true'
        run: |
          bundle exec ruby bin/bootstrap-dsql
          if [[ "${{ steps.infra.outputs.search }}" == "true" ]]; then DSQL_RUNTIME_ROLE_ARN="$SEARCH_INDEXER_DSQL_RUNTIME_ROLE_ARN" bundle exec ruby bin/bootstrap-dsql; fi
          if [[ "${{ steps.infra.outputs.inbox }}" == "true" ]]; then DSQL_RUNTIME_ROLE_ARN="$INBOX_SYNC_DSQL_RUNTIME_ROLE_ARN" bundle exec ruby bin/bootstrap-dsql; fi
          if [[ "${{ steps.infra.outputs.oauth }}" == "true" ]]; then DSQL_RUNTIME_ROLE_ARN="$BLUESKY_OAUTH_DSQL_RUNTIME_ROLE_ARN" bundle exec ruby bin/bootstrap-dsql; fi
          if [[ "${{ steps.infra.outputs.receiver }}" == "true" ]]; then DSQL_RUNTIME_ROLE_ARN="$WEBMENTION_RECEIVER_DSQL_RUNTIME_ROLE_ARN" bundle exec ruby bin/bootstrap-dsql; fi
          if [[ "${{ steps.infra.outputs.worker }}" == "true" ]]; then DSQL_RUNTIME_ROLE_ARN="$WEBMENTION_WORKER_DSQL_RUNTIME_ROLE_ARN" bundle exec ruby bin/bootstrap-dsql; fi
          if [[ "${{ steps.infra.outputs.publisher }}" == "true" ]]; then DSQL_RUNTIME_ROLE_ARN="$WEBMENTION_PUBLISHER_DSQL_RUNTIME_ROLE_ARN" bundle exec ruby bin/bootstrap-dsql; fi
          if [[ "${{ steps.infra.outputs.cleanup }}" == "true" ]]; then DSQL_RUNTIME_ROLE_ARN="$WEBMENTION_CLEANUP_DSQL_RUNTIME_ROLE_ARN" bundle exec ruby bin/bootstrap-dsql; fi

      - name: Record schema completion
        id: schema
        if: steps.current.outputs.current == 'true'
        run: echo "completed_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Deploy authoring Lambda image
        if: steps.current.outputs.current == 'true' && needs.build-authoring.outputs.deploy == 'true'
        run: |
          image_uri="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}@${AUTHORING_DIGEST}"
          aws lambda update-function-code --function-name "$LAMBDA_FUNCTION" --image-uri "$image_uri"
          aws lambda wait function-updated-v2 --function-name "$LAMBDA_FUNCTION"

      - name: Deploy Webmention Lambda image
        if: steps.current.outputs.current == 'true' && needs.build-authoring.outputs.deploy == 'true' && (steps.infra.outputs.receiver == 'true' || steps.infra.outputs.worker == 'true' || steps.infra.outputs.publisher == 'true' || steps.infra.outputs.cleanup == 'true')
        run: |
          image_uri="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}@${AUTHORING_DIGEST}"
          if [[ "${{ steps.infra.outputs.receiver }}" == "true" ]]; then
            aws lambda update-function-code --function-name "$WEBMENTION_RECEIVER_LAMBDA_FUNCTION" --image-uri "$image_uri"
            aws lambda wait function-updated-v2 --function-name "$WEBMENTION_RECEIVER_LAMBDA_FUNCTION"
          fi
          if [[ "${{ steps.infra.outputs.worker }}" == "true" ]]; then
            aws lambda update-function-code --function-name "$WEBMENTION_WORKER_LAMBDA_FUNCTION" --image-uri "$image_uri"
            aws lambda wait function-updated-v2 --function-name "$WEBMENTION_WORKER_LAMBDA_FUNCTION"
          fi
          if [[ "${{ steps.infra.outputs.publisher }}" == "true" ]]; then
            aws lambda update-function-code --function-name "$WEBMENTION_PUBLISHER_LAMBDA_FUNCTION" --image-uri "$image_uri"
            aws lambda wait function-updated-v2 --function-name "$WEBMENTION_PUBLISHER_LAMBDA_FUNCTION"
          fi
          if [[ "${{ steps.infra.outputs.cleanup }}" == "true" ]]; then
            aws lambda update-function-code --function-name "$WEBMENTION_CLEANUP_LAMBDA_FUNCTION" --image-uri "$image_uri"
            aws lambda wait function-updated-v2 --function-name "$WEBMENTION_CLEANUP_LAMBDA_FUNCTION"
          fi

      - name: Deploy search indexer Lambda image
        if: steps.current.outputs.current == 'true' && needs.build-search.outputs.deploy == 'true'
        run: |
          image_uri="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${SEARCH_INDEXER_ECR_REPOSITORY}@${SEARCH_DIGEST}"
          aws lambda update-function-code --function-name "$SEARCH_INDEXER_LAMBDA_FUNCTION" --image-uri "$image_uri"
          aws lambda wait function-updated-v2 --function-name "$SEARCH_INDEXER_LAMBDA_FUNCTION"

      - name: Deploy inbox sync Lambda image
        if: steps.current.outputs.current == 'true' && needs.build-inbox.outputs.deploy == 'true'
        run: |
          image_uri="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${INBOX_SYNC_ECR_REPOSITORY}@${INBOX_DIGEST}"
          if [[ "${{ steps.infra.outputs.inbox }}" == "true" ]]; then
            aws lambda update-function-code --function-name "$INBOX_SYNC_LAMBDA_FUNCTION" --image-uri "$image_uri"
            aws lambda wait function-updated-v2 --function-name "$INBOX_SYNC_LAMBDA_FUNCTION"
          fi
          if [[ "${{ steps.infra.outputs.notifier }}" == "true" ]]; then
            aws lambda update-function-code --function-name "$MATRIX_NOTIFIER_LAMBDA_FUNCTION" --image-uri "$image_uri"
            aws lambda wait function-updated-v2 --function-name "$MATRIX_NOTIFIER_LAMBDA_FUNCTION"
          fi

      - name: Deploy Bluesky OAuth Lambda image
        if: steps.current.outputs.current == 'true' && needs.build-oauth.outputs.deploy == 'true'
        run: |
          image_uri="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${BLUESKY_OAUTH_ECR_REPOSITORY}@${OAUTH_DIGEST}"
          aws lambda update-function-code --function-name "$BLUESKY_OAUTH_LAMBDA_FUNCTION" --image-uri "$image_uri"
          aws lambda wait function-updated-v2 --function-name "$BLUESKY_OAUTH_LAMBDA_FUNCTION"

      - name: Record Lambda deployment completion
        id: lambda
        if: steps.current.outputs.current == 'true'
        run: echo "completed_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Publish immutable site assets
        if: steps.current.outputs.current == 'true'
        run: >-
          aws s3 sync dist/site/static/authoring/assets/ "s3://${SITE_BUCKET}/static/authoring/assets/"
          --only-show-errors --cache-control 'public,max-age=31536000,immutable'
      - name: Publish site HTML
        if: steps.current.outputs.current == 'true'
        run: >-
          aws s3 cp dist/site/index.html "s3://${SITE_BUCKET}/index.html" --only-show-errors
          --content-type 'text/html; charset=utf-8' --cache-control 'public,max-age=0,must-revalidate'
      - name: Invalidate CloudFront
        if: steps.current.outputs.current == 'true'
        run: |
          invalidation_id="$(aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths '/*' --query 'Invalidation.Id' --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --id "$invalidation_id"
      - name: Smoke check production
        if: steps.current.outputs.current == 'true'
        run: bundle exec ruby bin/smoke-production "$SITE_URL"
      - name: Record smoke check completion
        id: smoke
        if: steps.current.outputs.current == 'true'
        run: echo "completed_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Delete stale site assets
        if: steps.current.outputs.current == 'true'
        run: >-
          aws s3 sync dist/site/static/authoring/assets/ "s3://${SITE_BUCKET}/static/authoring/assets/"
          --delete --only-show-errors --cache-control 'public,max-age=31536000,immutable'

      - name: Summarize production deploy
        if: always() && steps.current.outputs.current == 'true'
        env:
          STARTED_AT: ${{ steps.timing.outputs.started_at }}
          SCHEMA_COMPLETED_AT: ${{ steps.schema.outputs.completed_at }}
          LAMBDA_COMPLETED_AT: ${{ steps.lambda.outputs.completed_at }}
          COMPLETED_AT: ${{ steps.smoke.outputs.completed_at }}
        run: |
          completed_at="${COMPLETED_AT:-$(date +%s)}"
          schema_completed_at="${SCHEMA_COMPLETED_AT:-$STARTED_AT}"
          lambda_completed_at="${LAMBDA_COMPLETED_AT:-$schema_completed_at}"
          elapsed="$((completed_at - STARTED_AT))"
          setup_and_schema="$((schema_completed_at - STARTED_AT))"
          lambda_deploy="$((lambda_completed_at - schema_completed_at))"
          site_and_smoke="$((completed_at - lambda_completed_at))"
          minutes="$((elapsed / 60))"
          seconds="$((elapsed % 60))"
          if (( elapsed <= 300 )) && [[ -n "$COMPLETED_AT" ]]; then slo="PASS"; else slo="FAIL"; fi
          {
            echo "## Production deploy"
            printf 'Duration: `%02dm %02ds`\n' "$minutes" "$seconds"
            printf 'Setup and schema: `%02dm %02ds`\n' "$((setup_and_schema / 60))" "$((setup_and_schema % 60))"
            printf 'Lambda deployment: `%02dm %02ds`\n' "$((lambda_deploy / 60))" "$((lambda_deploy % 60))"
            printf 'Site delivery and smoke check: `%02dm %02ds`\n' "$((site_and_smoke / 60))" "$((site_and_smoke % 60))"
            echo "SLO: \`${slo}\` (under \`05m 00s\`)"
            echo "Source commit: \`${TARGET_SHA}\`"
            echo "Authoring digest: \`${AUTHORING_DIGEST}\`"
            echo "Search digest: \`${SEARCH_DIGEST:-not-provisioned}\`"
            echo "Inbox digest: \`${INBOX_DIGEST:-not-provisioned}\`"
            echo "OAuth digest: \`${OAUTH_DIGEST:-not-provisioned}\`"
          } >> "$GITHUB_STEP_SUMMARY"
