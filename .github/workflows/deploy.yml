name: Deploy production

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-1
  AWS_ACCOUNT_ID: "282782318939"
  DSQL_HOST: zjuauvwetzvab4i3bdfd47e3yu.dsql.ap-northeast-1.on.aws
  DSQL_RUNTIME_ROLE_ARN: arn:aws:iam::282782318939:role/weblog-authoring-production-runtime
  SEARCH_INDEXER_DSQL_RUNTIME_ROLE_ARN: arn:aws:iam::282782318939:role/weblog-search-indexer-production-runtime
  INBOX_SYNC_DSQL_RUNTIME_ROLE_ARN: arn:aws:iam::282782318939:role/weblog-inbox-sync-production-runtime
  BLUESKY_OAUTH_DSQL_RUNTIME_ROLE_ARN: arn:aws:iam::282782318939:role/weblog-bluesky-oauth-production-runtime
  ECR_REPOSITORY: weblog-authoring-production
  LAMBDA_FUNCTION: weblog-authoring-production
  SEARCH_INDEXER_ECR_REPOSITORY: weblog-search-indexer-production
  SEARCH_INDEXER_LAMBDA_FUNCTION: weblog-search-indexer-production
  INBOX_SYNC_ECR_REPOSITORY: weblog-inbox-sync-production
  INBOX_SYNC_LAMBDA_FUNCTION: weblog-inbox-sync-production
  BLUESKY_OAUTH_ECR_REPOSITORY: weblog-bluesky-oauth-production
  BLUESKY_OAUTH_LAMBDA_FUNCTION: weblog-bluesky-oauth-production
  SITE_BUCKET: weblog-asonas-site-production-282782318939
  DEVELOPMENT_ASSET_BUCKET: weblog-asonas-assets-dev-282782318939
  CLOUDFRONT_DISTRIBUTION_ID: E3BCWEKGAG5LSG

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0

      - name: Detect Lambda changes
        id: lambda-changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" "$AFTER_SHA" -- Dockerfile.lambda Dockerfile.search-indexer Dockerfile.inbox-sync Dockerfile.bluesky-oauth Gemfile Gemfile.lock package.json package-lock.json lib/ lambda/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # master
        with:
          ruby-version: 4.0.6
          bundler-cache: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:authoring
      - run: npm run test:bluesky-oauth
      - run: npm run build:bluesky-oauth
      - run: npm run build
      - run: bundle exec ruby -Itest -e 'Dir["test/**/*_test.rb", "test/**/test_*.rb"].uniq.sort.each { |file| require_relative file }'

      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: arn:aws:iam::282782318939:role/WeblogGitHubDeploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Detect search indexer infrastructure
        id: search-infra
        run: |
          if aws ecr describe-repositories --repository-names "$SEARCH_INDEXER_ECR_REPOSITORY" >/dev/null 2>&1 \
            && aws lambda get-function --function-name "$SEARCH_INDEXER_LAMBDA_FUNCTION" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect inbox sync infrastructure
        id: inbox-sync-infra
        run: |
          if aws ecr describe-repositories --repository-names "$INBOX_SYNC_ECR_REPOSITORY" >/dev/null 2>&1 \
            && aws lambda get-function --function-name "$INBOX_SYNC_LAMBDA_FUNCTION" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect Bluesky OAuth infrastructure
        id: bluesky-oauth-infra
        run: |
          if aws ecr describe-repositories --repository-names "$BLUESKY_OAUTH_ECR_REPOSITORY" >/dev/null 2>&1 \
            && aws lambda get-function --function-name "$BLUESKY_OAUTH_LAMBDA_FUNCTION" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply database schema
        run: |
          bundle exec ruby bin/bootstrap-dsql
          DSQL_RUNTIME_ROLE_ARN="$SEARCH_INDEXER_DSQL_RUNTIME_ROLE_ARN" bundle exec ruby bin/bootstrap-dsql
          if [[ "${{ steps.inbox-sync-infra.outputs.ready }}" == "true" ]]; then
            DSQL_RUNTIME_ROLE_ARN="$INBOX_SYNC_DSQL_RUNTIME_ROLE_ARN" bundle exec ruby bin/bootstrap-dsql
          fi
          if [[ "${{ steps.bluesky-oauth-infra.outputs.ready }}" == "true" ]]; then
            DSQL_RUNTIME_ROLE_ARN="$BLUESKY_OAUTH_DSQL_RUNTIME_ROLE_ARN" bundle exec ruby bin/bootstrap-dsql
          fi

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        if: steps.lambda-changes.outputs.changed == 'true'

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: steps.lambda-changes.outputs.changed == 'true'

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.lambda-changes.outputs.changed == 'true'

      - name: Build and publish Lambda image
        if: steps.lambda-changes.outputs.changed == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.lambda
          platforms: linux/arm64
          provenance: false
          push: true
          tags: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish search indexer Lambda image
        if: steps.lambda-changes.outputs.changed == 'true' && steps.search-infra.outputs.ready == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.search-indexer
          platforms: linux/arm64
          provenance: false
          push: true
          tags: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.SEARCH_INDEXER_ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish inbox sync Lambda image
        if: steps.lambda-changes.outputs.changed == 'true' && steps.inbox-sync-infra.outputs.ready == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.inbox-sync
          platforms: linux/arm64
          provenance: false
          push: true
          tags: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.INBOX_SYNC_ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish Bluesky OAuth Lambda image
        if: steps.lambda-changes.outputs.changed == 'true' && steps.bluesky-oauth-infra.outputs.ready == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.bluesky-oauth
          platforms: linux/arm64
          provenance: false
          push: true
          tags: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.BLUESKY_OAUTH_ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Lambda image
        if: steps.lambda-changes.outputs.changed == 'true'
        env:
          IMAGE_URI: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_attempt }}
        run: |
          aws lambda update-function-code --function-name "$LAMBDA_FUNCTION" --image-uri "$IMAGE_URI"
          aws lambda wait function-updated-v2 --function-name "$LAMBDA_FUNCTION"

      - name: Deploy inbox sync Lambda image
        if: steps.lambda-changes.outputs.changed == 'true' && steps.inbox-sync-infra.outputs.ready == 'true'
        env:
          IMAGE_URI: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.INBOX_SYNC_ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_attempt }}
        run: |
          aws lambda update-function-code --function-name "$INBOX_SYNC_LAMBDA_FUNCTION" --image-uri "$IMAGE_URI"
          aws lambda wait function-updated-v2 --function-name "$INBOX_SYNC_LAMBDA_FUNCTION"

      - name: Deploy search indexer Lambda image
        if: steps.lambda-changes.outputs.changed == 'true' && steps.search-infra.outputs.ready == 'true'
        env:
          IMAGE_URI: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.SEARCH_INDEXER_ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_attempt }}
        run: |
          aws lambda update-function-code --function-name "$SEARCH_INDEXER_LAMBDA_FUNCTION" --image-uri "$IMAGE_URI"
          aws lambda wait function-updated-v2 --function-name "$SEARCH_INDEXER_LAMBDA_FUNCTION"

      - name: Deploy Bluesky OAuth Lambda image
        if: steps.lambda-changes.outputs.changed == 'true' && steps.bluesky-oauth-infra.outputs.ready == 'true'
        env:
          IMAGE_URI: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.BLUESKY_OAUTH_ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_attempt }}
        run: |
          aws lambda update-function-code --function-name "$BLUESKY_OAUTH_LAMBDA_FUNCTION" --image-uri "$IMAGE_URI"
          aws lambda wait function-updated-v2 --function-name "$BLUESKY_OAUTH_LAMBDA_FUNCTION"

      - name: Publish site and existing images
        run: |
          aws s3 sync static/ "s3://$SITE_BUCKET/" --only-show-errors
          aws s3 sync static/authoring/ "s3://$SITE_BUCKET/static/authoring/" --only-show-errors
          aws s3 sync "s3://$DEVELOPMENT_ASSET_BUCKET/assets/" "s3://$SITE_BUCKET/assets/" --exclude '*' --include 'asset_*' --only-show-errors

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths '/*'
