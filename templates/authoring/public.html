<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title><%= CGI.escapeHTML(title.to_s) %></title>
    <style>
      :root {
        color-scheme: light;
        font-family: sans-serif;
      }

      body {
        margin: 0;
        background: #f5f5f0;
        color: #171717;
      }

      main {
        max-width: 48rem;
        margin: 0 auto;
        padding: 3rem 1.25rem 4rem;
      }

      .page-header h1 {
        margin: 0 0 1.5rem;
      }

      .page-view p,
      .page-view li {
        line-height: 1.7;
      }

      .page-view pre {
        overflow-x: auto;
        padding: 1rem;
        background: #1f2937;
        color: #f9fafb;
      }

      .backlinks,
      .markdown-problems {
        margin-top: 2rem;
        padding-top: 1rem;
        border-top: 1px solid #d4d4d4;
      }
    </style>
  </head>
  <body>
    <main>
      <%= page_html %>
    </main>
  </body>
</html>
