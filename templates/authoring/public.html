<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title><%= CGI.escapeHTML(title.to_s) %></title>
    <link rel="alternate" type="application/atom+xml" title="weblog.ason.as" href="/feed.xml">
    <style>
      :root {
        color-scheme: light;
        font-family: sans-serif;
      }

      body {
        margin: 0;
        background: #f5f5f0;
        color: #171717;
      }

      main {
        max-width: 48rem;
        margin: 0 auto;
        padding: 3rem 1.25rem 4rem;
      }

      .page-header h1 {
        margin: 0 0 1.5rem;
      }

      .page-view p,
      .page-view li {
        line-height: 1.7;
      }

      .page-view pre {
        overflow-x: auto;
        padding: 1rem;
        background: #1f2937;
        color: #f9fafb;
      }

      .youtube-player {
        width: 100%;
        margin: 1.5rem 0;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border-radius: 0.65rem;
        background: #000;
      }

      .youtube-player iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }

      .youtube-player__fallback {
        display: none;
        position: relative;
        width: 100%;
        height: 100%;
        color: #fff;
        background: #000;
        text-decoration: none;
      }

      .youtube-player__fallback img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .youtube-player__brand {
        position: absolute;
        top: 1rem;
        left: 1rem;
        display: inline-flex;
        min-height: 2rem;
        align-items: center;
        gap: 0.45rem;
        padding: 0 0.75rem;
        border-radius: 999px;
        background: rgb(255 0 51);
        color: #fff;
        font-weight: 700;
        line-height: 1;
        box-shadow: 0 1px 3px rgb(0 0 0 / 28%);
      }

      .youtube-player__brand::before {
        content: "";
        width: 0;
        height: 0;
        border-top: 0.3rem solid transparent;
        border-bottom: 0.3rem solid transparent;
        border-left: 0.5rem solid currentColor;
      }

      .youtube-player__details {
        position: absolute;
        right: 1rem;
        bottom: 1rem;
        left: 1rem;
        display: grid;
        gap: 0.15rem;
        overflow: hidden;
        padding: 0.7rem 0.85rem;
        border-radius: 0.45rem;
        background: rgb(0 0 0 / 88%);
        color: #fff;
      }

      .youtube-player__details strong {
        font-size: 0.95rem;
      }

      .youtube-player__url {
        overflow: hidden;
        color: rgb(255 255 255 / 82%);
        font-size: 0.78rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .youtube-player__fallback:focus-visible {
        outline: 3px solid #fff;
        outline-offset: -5px;
      }

      .youtube-player--fallback iframe {
        display: none;
      }

      .youtube-player--fallback .youtube-player__fallback {
        display: block;
      }

      .backlinks,
      .markdown-problems {
        margin-top: 2rem;
        padding-top: 1rem;
        border-top: 1px solid #d4d4d4;
      }
    </style>
  </head>
  <body>
    <main>
      <%= page_html %>
    </main>
    <script>
      var youtubeFrames = document.querySelectorAll("iframe[data-youtube-player-frame]");
      if (youtubeFrames.length > 0) {
        document.querySelectorAll("img[data-youtube-thumbnail-fallback]").forEach(function (image) {
          image.addEventListener("error", function () {
            var fallback = image.dataset.youtubeThumbnailFallback;
            if (!fallback || image.src === fallback) return;
            delete image.dataset.youtubeThumbnailFallback;
            image.src = fallback;
          });
        });
        window.onYouTubeIframeAPIReady = function () {
          youtubeFrames.forEach(function (iframe) {
            new YT.Player(iframe, {
              events: {
                onError: function () {
                  var player = iframe.closest(".youtube-player");
                  if (player) player.classList.add("youtube-player--fallback");
                }
              }
            });
          });
        };
        var youtubeApi = document.createElement("script");
        youtubeApi.src = "https://www.youtube.com/iframe_api";
        youtubeApi.async = true;
        document.head.appendChild(youtubeApi);
      }
    </script>
  </body>
</html>
