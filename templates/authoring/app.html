<!doctype html>
  <html lang="ja" data-theme="teal" data-environment="development" data-can-edit="<%= auth.fetch("can_edit") %>" data-csrf-token="<%= CGI.escapeHTML(auth.fetch("csrf_token")) %>">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>[dev] <%= CGI.escapeHTML(title.to_s) %></title>
    <link rel="alternate" type="application/atom+xml" title="weblog.ason.as" href="/feed.xml">
    <link rel="stylesheet" href="/static/authoring/app.css?v=2">
    <script src="/static/authoring/app.js?v=2" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">本文へ移動</a>
    <header class="site-header">
      <nav class="header-nav" aria-label="主要ナビゲーション">
        <a href="/">weblog.ason.as</a>
        <span class="header-actions">
          <button class="header-action universe-toggle" id="universe-toggle" type="button" aria-label="ユニバースを開く" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="2"/>
              <ellipse cx="12" cy="12" rx="9" ry="4.5"/>
              <ellipse cx="12" cy="12" rx="4.5" ry="9" transform="rotate(42 12 12)"/>
              <circle cx="20" cy="12" r="1.25"/>
            </svg>
          </button>
          <a class="header-action" id="new-page-action" href="/?new=1" aria-label="新しい記事を作成"<%= auth.fetch("can_edit") ? "" : " hidden" %>>＋</a>
          <a class="header-action" id="daily-page-action" href="/?new=daily" aria-label="今日の日記を開く"<%= auth.fetch("can_edit") ? "" : " hidden" %>>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 2v3M17 2v3M3.5 9h17M5 4h14a1.5 1.5 0 0 1 1.5 1.5v14A1.5 1.5 0 0 1 19 21H5a1.5 1.5 0 0 1-1.5-1.5v-14A1.5 1.5 0 0 1 5 4Z"/>
            </svg>
          </a>
          <a class="header-action" href="/feed.xml" aria-label="Atomフィードを開く">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="5" cy="19" r="1.5"/>
              <path d="M4 11a9 9 0 0 1 9 9M4 5a15 15 0 0 1 15 15"/>
            </svg>
          </a>
        </span>
      </nav>
    </header>
    <main id="main" class="page-shell">
      <div id="authoring-root"></div>
      <noscript>記事の編集にはJavaScriptが必要です。</noscript>
      <script id="authoring-data" type="application/json"><%= initial_state %></script>
    </main>
  </body>
</html>
