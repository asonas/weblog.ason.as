<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title><%= title %></title>
    <link rel="stylesheet" href="/static/authoring/app.css">
  </head>
  <body>
    <a class="skip-link" href="#main">本文へ移動</a>
    <header class="site-header">
      <nav aria-label="主要ナビゲーション">
        <a href="/">今日を編集</a>
        <a href="/manage" aria-current="page">管理</a>
      </nav>
    </header>
    <main id="main" class="page-shell">
      <h1>管理</h1>

      <section class="settings-panel" aria-labelledby="new-page-heading">
        <h2 id="new-page-heading">新しいページ</h2>
        <p class="management-actions">
          <a class="button-link" href="/editor/new?type=named">作成</a>
          <a class="button-link" href="/editor/today?template=daily">今日の日記</a>
        </p>
      </section>

      <section class="settings-panel" aria-labelledby="filter-heading">
        <h2 id="filter-heading">絞り込み</h2>
        <form method="get" class="filter-form">
          <div class="field-group">
            <label for="q">検索</label>
            <input id="q" name="q" value="<%= search %>">
          </div>
          <label class="checkbox-label">
            <input type="checkbox" name="empty" value="1"<%= empty_checked %>> 空ページのみ
          </label>
          <button type="submit">絞り込む</button>
        </form>
      </section>

      <section aria-labelledby="pages-heading">
        <h2 id="pages-heading">ページ</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>種別</th><th>名前または日付</th><th>内容</th><th>操作</th></tr>
            </thead>
            <tbody><%= rows %></tbody>
          </table>
        </div>
      </section>

      <section class="settings-panel" aria-labelledby="problems-heading">
        <h2 id="problems-heading">問題</h2>
        <%= problems %>
      </section>
    </main>
  </body>
</html>
