<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}}</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1d292b;
        --muted: #5c6c6b;
        --paper: #eef3f1;
        --card: #fffdf8;
        --line: #cbd6d2;
        --accent: #ae4d3c;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Hiragino Sans", sans-serif;
        color: var(--ink);
        background-color: var(--paper);
        background-image: linear-gradient(rgba(38, 74, 77, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(38, 74, 77, 0.045) 1px, transparent 1px);
        background-size: 24px 24px;
        line-height: 1.7;
      }
      body { max-width: 48rem; margin: 0 auto; padding: 2rem 1rem 5rem; }
      a { color: inherit; text-decoration-color: #9eaea9; text-underline-offset: 0.2em; }
      a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
      header.site-header { margin-bottom: 2rem; }
      .site-header__brand { color: var(--muted); font-size: 0.9rem; letter-spacing: 0.08em; }
      h1, h2 { font-family: "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif; line-height: 1.25; }
      h1 { font-size: clamp(1.6rem, 5vw, 2.4rem); margin: 0.35rem 0 0; }
      .post-stream { display: grid; gap: 1rem; }
      .post-card, .asset-card, .backlinks {
        background: color-mix(in srgb, var(--card) 92%, transparent);
        border: 1px solid var(--line);
        border-radius: 0.35rem 1rem 0.35rem 0.35rem;
        box-shadow: 0 0.6rem 1.5rem rgba(38, 74, 77, 0.08);
      }
      .post-card { padding: 1.1rem 1.2rem 1.25rem; }
      .post-card.card--expanded { border-left: 4px solid var(--accent); }
      .post-card__header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.4rem 1rem; }
      .post-card h2 { font-size: 1.25rem; margin: 0; }
      time { color: var(--muted); font-size: 0.82rem; white-space: nowrap; }
      .post-body--compact { max-height: 7rem; overflow: hidden; }
      .post-body p:first-child { margin-top: 0.55rem; }
      .post-body p:last-child { margin-bottom: 0; }
      .post-assets { display: grid; gap: 0.6rem; margin-top: 1rem; }
      .asset-card { padding: 0.75rem 0.9rem; font-size: 0.9rem; border-radius: 0.25rem 0.7rem 0.25rem 0.25rem; }
      .asset-card a { display: flex; align-items: baseline; gap: 0.6rem; }
      .asset-card__kind { color: var(--accent); font-size: 0.72rem; text-transform: uppercase; }
      .asset-card__name { overflow-wrap: anywhere; }
      .asset-card__backlinks { display: block; color: var(--muted); font-size: 0.8rem; margin-top: 0.35rem; }
      .asset-card__backlinks a { margin-left: 0.4rem; }
      .backlinks { margin-top: 1rem; padding: 1rem 1.2rem; }
      .backlinks h2 { font-size: 1rem; margin: 0 0 0.4rem; }
      .backlinks ul, .date-list { margin: 0; padding-left: 1.2rem; }
      .empty-state { color: var(--muted); }
      .asset-page__placeholder { border: 1px dashed #9eaea9; border-radius: 0.6rem; padding: 3rem 1rem; text-align: center; color: var(--muted); }
      @supports not (background: color-mix(in srgb, white, black)) { .post-card, .asset-card, .backlinks { background: var(--card); } }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="site-header__brand" href="/">log.ason.as</a>
      <h1>{{title}}</h1>
    </header>
    <main>{{content}}</main>
  </body>
</html>
