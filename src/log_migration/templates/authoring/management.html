<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{title}}</title><link rel="stylesheet" href="/static/authoring/authoring.css"></head><body><header><nav aria-label="主要ナビゲーション"><a href="/">今日を編集</a> <a href="/manage">管理</a></nav></header><main><h1>管理</h1><form method="get"><label for="q">検索</label><input id="q" name="q" value="{{search}}"><label for="status">状態</label><select id="status" name="status"><option value="">すべて</option><option value="draft"{{draft_selected}}>下書き</option><option value="published"{{published_selected}}>公開済み</option></select><label><input type="checkbox" name="empty" value="1"{{empty_checked}}> 空ページのみ</label><button type="submit">絞り込む</button></form><section aria-labelledby="pages-heading"><h2 id="pages-heading">ページ</h2><table><thead><tr><th>種別</th><th>名前または日付</th><th>状態</th><th>空状態</th><th>操作</th></tr></thead><tbody>{{rows}}</tbody></table></section><section aria-labelledby="problems-heading"><h2 id="problems-heading">問題</h2>{{problems}}</section></main></body></html>
