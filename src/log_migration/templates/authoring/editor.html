<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{title}}</title><link rel="stylesheet" href="/static/authoring/authoring.css"><script src="/static/authoring/editor.js" defer></script></head><body><header><nav aria-label="主要ナビゲーション"><a href="/">今日を編集</a> <a href="/manage">管理</a></nav></header><main><h1>編集</h1><p id="save-status" aria-live="polite">{{saved_at}}・{{status}}</p><form id="editor" data-page-id="{{page_id}}" data-page-type="{{page_type}}" data-page-date="{{page_date}}" data-page-name="{{name}}" data-expected-updated-at="{{expected_updated_at}}"><div class="editor-grid"><section aria-labelledby="input-heading"><h2 id="input-heading">入力</h2><label for="title">タイトル</label><input id="title" name="title" aria-describedby="title-errors" value="{{document_title}}"><p id="title-errors" class="input-error" aria-live="polite"></p><label for="body">本文（Markdown）</label><textarea id="body" name="body" aria-describedby="body-errors body-preview-errors" rows="24">{{body}}</textarea><p id="body-errors" class="input-error" aria-live="polite"></p><p id="body-preview-errors" class="input-error" aria-live="polite"></p></section><section aria-labelledby="preview-heading"><h2 id="preview-heading">プレビュー</h2><div id="preview" aria-live="polite"></div></section></div><div class="editor-actions"><button type="submit">保存</button><button id="publish" type="button">公開</button><button id="unpublish" type="button">非公開にする</button></div></form></main></body></html>
