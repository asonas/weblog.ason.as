name: PhotoInbox
options:
  bundleIdPrefix: com.asonas.weblog
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 6.0
packages:
  SDWebImageWebPCoder:
    url: https://github.com/SDWebImage/SDWebImageWebPCoder.git
    exactVersion: 0.15.0
targets:
  PhotoInbox:
    type: application
    platform: iOS
    sources: [PhotoInbox]
    dependencies:
      - package: SDWebImageWebPCoder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asonas.weblog.PhotoInbox
        DEVELOPMENT_TEAM: QYP65434UW
        TARGETED_DEVICE_FAMILY: 1
        INFOPLIST_FILE: PhotoInbox/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
  PhotoInboxTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PhotoInboxTests]
    dependencies:
      - target: PhotoInbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asonas.weblog.PhotoInboxTests
        GENERATE_INFOPLIST_FILE: true
schemes:
  PhotoInbox:
    build:
      targets:
        PhotoInbox: all
        PhotoInboxTests: [test]
    test:
      gatherCoverageData: true
      targets: [PhotoInboxTests]
