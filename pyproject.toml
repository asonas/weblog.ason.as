[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "log-migration"
version = "0.1.0"
description = "Scrapbox migration and local preview tools for log.ason.as"
requires-python = ">=3.12,<3.15"
dependencies = [
    "markdown-it-py>=4,<5",
]

[project.optional-dependencies]
test = [
    "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
